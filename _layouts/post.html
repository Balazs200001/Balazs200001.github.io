---
layout: default
---
<article class="post">
  <a class="back-link" href="{{ '/' | relative_url }}" aria-label="Back to all posts" title="All posts">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
      <path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <span class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</span>
    {% include tag-list.html tags=page.tags %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/' | relative_url }}">&larr; All posts</a>
  </footer>
</article>
